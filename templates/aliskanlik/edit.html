{% extends "aliskanlik/_layout.html" %}
{% block title %}Düzenle{% endblock %}

{% block page_context %}<div class="bba-page-context">'{{ habit.name }}' Düzenle</div>{% endblock %}

{% block inner %}

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('aliskanlik.edit_habit', habit_id=habit.id) }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Alışkanlık adı</label>
                    <input type="text" name="name" class="form-control" value="{{ habit.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Neden? (isteğe bağlı)</label>
                    <input type="text" name="why" class="form-control" value="{{ habit.why or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Somut hedef (isteğe bağlı)</label>
                    <input type="text" name="target" class="form-control" placeholder="ör. 2.5 litre, 23:00 – 07:00" value="{{ habit.target or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Etki puanı</label>
                    <select name="impact" class="form-select">
                        {% for i in range(1, 6) %}
                        <option value="{{ i }}" {{ 'selected' if habit.impact == i }}>{{ i }}{{ ' — düşük' if i == 1 }}{{ ' — orta' if i == 3 }}{{ ' — yüksek' if i == 5 }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sıklık</label>
                    <select name="frequency_type" class="form-select" id="freq-select" onchange="toggleWeeklyTarget()">
                        <option value="gunluk" {{ 'selected' if habit.frequency_type == 'gunluk' }}>Her gün</option>
                        <option value="haftalik" {{ 'selected' if habit.frequency_type == 'haftalik' }}>Haftada birkaç kez</option>
                    </select>
                </div>
                <div class="col-md-4 {{ 'd-none' if habit.frequency_type != 'haftalik' }}" id="weekly-target-field">
                    <label class="form-label">Haftalık hedef (kaç kez)</label>
                    <input type="number" name="weekly_target" class="form-control font-mono" min="1" max="7"
                           value="{{ habit.weekly_target or 3 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nasıl takip edilsin?</label>
                    <select name="track_mode" class="form-select" id="track-mode-select" onchange="toggleAmountFields()">
                        <option value="toggle" {{ 'selected' if habit.track_mode == 'toggle' }}>Basit tik (yapıldı/yapılmadı)</option>
                        <option value="amount" {{ 'selected' if habit.track_mode == 'amount' }}>Miktar (ör. litre, adım)</option>
                        <option value="note" {{ 'selected' if habit.track_mode == 'note' }}>Not (o günü serbest metinle anlat)</option>
                    </select>
                </div>
                <div class="col-md-4 {{ 'd-none' if habit.track_mode != 'amount' }}" id="unit-field">
                    <label class="form-label">Birim</label>
                    <input type="text" name="unit" class="form-control" placeholder="ör. ml, adım, sayfa" value="{{ habit.unit or '' }}">
                </div>
                <div class="col-md-4 {{ 'd-none' if habit.track_mode != 'amount' }}" id="daily-target-field">
                    <label class="form-label">Günlük sayısal hedef</label>
                    <input type="number" name="daily_target" class="form-control font-mono" min="0" step="any"
                           value="{{ habit.daily_target or '' }}">
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{{ url_for('aliskanlik.manage_habits') }}" class="btn btn-outline-secondary">Vazgeç</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleWeeklyTarget() {
    const freq = document.getElementById('freq-select').value;
    const field = document.getElementById('weekly-target-field');
    if (freq === 'haftalik') field.classList.remove('d-none');
    else field.classList.add('d-none');
}
function toggleAmountFields() {
    const mode = document.getElementById('track-mode-select').value;
    const unitField = document.getElementById('unit-field');
    const targetField = document.getElementById('daily-target-field');
    if (mode === 'amount') { unitField.classList.remove('d-none'); targetField.classList.remove('d-none'); }
    else { unitField.classList.add('d-none'); targetField.classList.add('d-none'); }
}
</script>
{% endblock %}
