{% extends "sayac/_layout.html" %}
{% block title %}Düzenle{% endblock %}

{% block page_context %}<div class="bba-page-context">'{{ counter.name }}' Düzenle</div>{% endblock %}

{% block inner %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('sayac.edit_counter', counter_id=counter.id) }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Sayaç adı</label>
                    <input type="text" name="name" class="form-control" value="{{ counter.name }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Birim</label>
                    <input type="text" name="unit" class="form-control" value="{{ counter.unit or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Not (isteğe bağlı)</label>
                    <input type="text" name="why" class="form-control" value="{{ counter.why or '' }}">
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{{ url_for('sayac.manage_counters') }}" class="btn btn-outline-secondary">Vazgeç</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
